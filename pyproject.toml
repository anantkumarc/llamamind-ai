[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llamamind-ai"
version = "0.1.0"
description = "A cloud-powered terminal chatbot"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
]

[project.scripts]
Friday = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["llamamind_ai"]
